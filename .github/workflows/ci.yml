name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Pull requests: every Python on Linux; macOS and Windows minutes cost more, so they get
      # only the oldest and newest Python, where version differences show up.
      # Push to main (after a PR passed): a 3-job smoke check of the merged result.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-latest"],"python":["3.9","3.10","3.11","3.12","3.13","3.14","3.15"],"include":[{"os":"macos-latest","python":"3.9"},{"os":"macos-latest","python":"3.15"},{"os":"windows-latest","python":"3.9"},{"os":"windows-latest","python":"3.15"}]}' || '{"include":[{"os":"ubuntu-latest","python":"3.9"},{"os":"ubuntu-latest","python":"3.15"},{"os":"windows-latest","python":"3.15"}]}') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install pytest
      - run: python -m pytest -v

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every JSON file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f" || { echo "BAD $f"; status=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $status
